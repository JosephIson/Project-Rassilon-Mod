# =====================================================================
#  Project Rassilon: Legacy of the Time Lords  -  Gradle configuration
# =====================================================================

# --- Gradle JVM / daemon -------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# The build-number task reads the task graph at execution time, which the
# configuration cache does not allow. Keep it off.
org.gradle.configuration-cache=false

# --- Environment ---------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.259
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# --- Dependencies --------------------------------------------------------
geckolib_version=4.9.3
geckolib_version_range=[4.7,)

# --- Mod identity --------------------------------------------------------
mod_id=rassilon
mod_name=Project Rassilon
mod_full_name=Project Rassilon: Legacy of the Time Lords
mod_license=All Rights Reserved
mod_group_id=com.rassilon
mod_authors=JosephIson
mod_description=The ultimate Doctor Who overhaul: TARDIS travel through bigger-on-the-inside portals, regeneration, the Time Vortex and the story campaign "The Rassilon Decree".

# --- Versioning ----------------------------------------------------------
# Artifact: Rassilon-<minecraft_version>-v<version_major>.<version_minor>.<build_number>.jar
# build_number is rewritten automatically by the incrementBuildNumber task
# after every successful `gradlew build` / `gradlew jar`. Do not hand-edit
# it while a build is running.
version_major=0
version_minor=1
build_number=1
